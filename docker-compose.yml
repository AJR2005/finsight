# Runs FinSight with PostgreSQL: docker compose up --build, then open http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: finsight
      POSTGRES_DB: finsight
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight"]
      interval: 3s
      retries: 10
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://finsight:finsight@db:5432/finsight
      SECRET_KEY: change-me-in-production
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
