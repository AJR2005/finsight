# One-click deploy on Render (free tier): New > Blueprint > pick this repo.
services:
  - type: web
    name: finsight
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: finsight-db
          property: connectionString
databases:
  - name: finsight-db
    plan: free
